<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor Área Metropolitana del Maule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/light/main.css">
<style>
  :root{--verde:#81a78a;--amarillo:#eaa629;--rojo:#e95c62;--azul:#6c92cb;--tinta:#1a1a1a;--f:"Work Sans","Segoe UI",system-ui,sans-serif}
  html,body{margin:0;height:100%}
  body{font:400 15px/1.4 var(--f);color:var(--tinta);background:#fff}
  #viewDiv{position:absolute;inset:0}
  #estado{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#555;pointer-events:none}
  .comunas{position:absolute;left:12px;bottom:34px;z-index:5;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px);pointer-events:none}
  .comunas button{pointer-events:auto;font:500 14px var(--f);border:2px solid var(--azul);background:#fff;color:var(--tinta);border-radius:999px;padding:5px 12px;cursor:pointer}
  .comunas button:hover{background:#eef2fa}
  .comunas button[aria-pressed="true"]{background:var(--azul);color:#fff}
  .comunas button:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}
  .esri-view .esri-view-surface--inset-outline:focus::after{outline:none}
  @media (max-width:520px){.comunas{bottom:30px}.comunas button{font-size:12px;padding:3px 9px}}
</style>
</head>
<body>
<div id="viewDiv" role="region" aria-label="Mapa interactivo del Área Metropolitana del Maule"><div id="estado">Cargando mapa…</div></div>
<div class="comunas" aria-label="Ir a una comuna">
  <button type="button" data-c="Pencahue">Pencahue</button>
  <button type="button" data-c="San Javier">San Javier</button>
  <button type="button" data-c="Maule">Maule</button>
  <button type="button" data-c="Talca">Talca</button>
  <button type="button" data-c="San Rafael">San Rafael</button>
  <button type="button" data-c="Pelarco">Pelarco</button>
  <button type="button" data-c="San Clemente">San Clemente</button>
</div>
<script src="https://js.arcgis.com/4.31/"></script>
<script>
  require([
    "esri/WebMap","esri/views/MapView","esri/rest/locator",
    "esri/widgets/LayerList","esri/widgets/Legend","esri/widgets/BasemapGallery",
    "esri/widgets/Expand","esri/widgets/Home","esri/widgets/ScaleBar","esri/widgets/Fullscreen"
  ], function(WebMap, MapView, locator, LayerList, Legend, BasemapGallery, Expand, Home, ScaleBar, Fullscreen){
    var estado = document.getElementById("estado");
    var enIframe = window.self !== window.top;
    var webmap = new WebMap({ portalItem: { id: "77f5fd410a1049dab78744c059baba0b", portal: { url: "https://ocuc.maps.arcgis.com" } } });
    var view = new MapView({ container: "viewDiv", map: webmap,
      navigation: { mouseWheelZoomEnabled: !enIframe },
      popup: { dockEnabled: true, dockOptions: { position: "top-right", breakpoint: false } } });

    view.when(function(){
      estado.remove();
      var chico = window.innerWidth < 700;
      var capas = new Expand({ view: view, expandTooltip: "Capas", group: "panel", expanded: !chico,
        content: new LayerList({ view: view, listItemCreatedFunction: function(e){
          if (e.item.layer.type !== "group") e.item.panel = { content: "legend", open: false };
        } }) });
      var leyenda = new Expand({ view: view, expandTooltip: "Leyenda", group: "panel", content: new Legend({ view: view }) });
      var fondos = new Expand({ view: view, expandTooltip: "Mapa base", group: "panel", content: new BasemapGallery({ view: view }) });
      view.ui.add(new Home({ view: view }), "top-left");
      view.ui.add(new Fullscreen({ view: view }), "top-left");
      view.ui.add([capas, leyenda, fondos], "top-right");
      view.ui.add(new ScaleBar({ view: view, unit: "metric" }), "bottom-right");
    }, function(err){
      estado.textContent = "No se pudo cargar el mapa. Verifica que el mapa y sus capas estén compartidos como públicos en ArcGIS Online.";
      console.error(err);
    });

    // Dentro del landing, la rueda del mouse no hace zoom hasta hacer clic en el mapa (así no se traba el scroll de la página)
    if (enIframe){
      view.on("click", function(){ view.navigation.mouseWheelZoomEnabled = true; });
      document.getElementById("viewDiv").addEventListener("mouseleave", function(){ view.navigation.mouseWheelZoomEnabled = false; });
    }

    var geocoder = "https://geocode-api.arcgis.com/arcgis/rest/services/World/GeocodeServer";
    var botones = document.querySelectorAll(".comunas button");
    botones.forEach(function(b){
      b.setAttribute("aria-pressed","false");
      b.addEventListener("click", function(){
        botones.forEach(function(o){ o.setAttribute("aria-pressed", o === b ? "true" : "false"); });
        locator.addressToLocations(geocoder, {
          address: { address: b.dataset.c + ", Región del Maule, Chile" },
          countryCode: "CHL", categories: ["City"], maxLocations: 1
        }).then(function(r){
          if (!r.length) return;
          view.goTo(r[0].extent ? r[0].extent.expand(1.3) : { target: r[0].location, zoom: 11 }, { duration: 900 });
        }).catch(function(e){ console.warn(e); });
      });
    });
  });
</script>
</body>
</html>
